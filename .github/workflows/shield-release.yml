# Manual public Hyperion Shield Zero packages. Hyperion Zero Private has no upload workflow:
# its private full bundle is built locally with the maintainer's own game install.
name: Hyperion Shield Zero release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch, tag or commit to package"
        required: true
        default: "release-v0.7.3"
      tag:
        description: "unique release tag to create"
        required: true
        default: "hyperion-shield-zero-v0.7.3-beta"
      channel:
        description: "publish as a prerelease for testing or a final release"
        required: true
        default: "prerelease"
        type: choice
        options:
          - prerelease
          - release
      publish:
        description: "create the GitHub release after acceptance; false leaves workflow artifacts only"
        required: true
        default: true
        type: boolean
      runtime-only:
        description: "run only the bridge and real macOS runtime acceptance, skipping platform packages"
        required: true
        default: false
        type: boolean
      mac-backend:
        description: "runtime-only diagnostic backend; non-default backends cannot publish"
        required: true
        default: "rosetta"
        type: choice
        options:
          - rosetta
          - fex-probe

permissions:
  contents: read

jobs:
  pluto-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LLVM_MINGW_VERSION: "20261020"
      LLVM_MINGW_SHA256: "ceb8c5acc6f76e143f9c714772d2fa677027802561ce68c396e8dc990a80f0b6"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Restrict alternate Mac backends to diagnostic runs
        run: |
          if [ "${{ inputs.mac-backend }}" != rosetta ] && [ "${{ inputs.runtime-only }}" != true ]; then
            echo "Alternate Mac backends are probe-only; use runtime-only with publish=false." >&2
            exit 1
          fi

      - name: Install the pinned llvm-mingw toolchain
        run: |
          set -euo pipefail
          name="llvm-mingw-${LLVM_MINGW_VERSION}-msvcrt-ubuntu-22.04-x86_64"
          archive="$RUNNER_TEMP/$name.tar.xz"
          curl --proto '=https' --tlsv1.2 --retry 3 -fL \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/$name.tar.xz" \
            -o "$archive"
          printf '%s  %s\n' "$LLVM_MINGW_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "MINGW=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Clean reproducible bridge build and structural tests
        working-directory: engine/tools/pluto-bridge
        run: |
          set -euo pipefail
          test ! -e pluto-bridge.exe
          ./build.sh
          first=$(sha256sum pluto-bridge.exe | cut -d' ' -f1)
          ./build.sh
          second=$(sha256sum pluto-bridge.exe | cut -d' ' -f1)
          test "$first" = "$second"
          echo "Reproducible pluto-bridge.exe SHA-256: $second"
          ./host/run-tests.sh
          ./lifecycle/run-tests.sh
          ./metadata/run-tests.sh
          ./late-state/run_tests.sh

      - name: Build the diagnostic x86-64 CPU feature probe
        working-directory: engine/tools/pluto-bridge
        run: |
          "$MINGW/bin/x86_64-w64-mingw32-g++" -std=c++17 -O0 \
            -ffile-prefix-map="$PWD"=. -Wl,--no-insert-timestamp \
            cpuid_probe.cpp -o cpuid-probe.exe -static-libgcc -static-libstdc++

      - name: Upload only the Hyperion-owned bridge
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-pluto-bridge
          path: engine/tools/pluto-bridge/pluto-bridge.exe
          if-no-files-found: error

      - name: Upload the Hyperion-owned CPU feature probe
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-pluto-cpuid-probe
          path: engine/tools/pluto-bridge/cpuid-probe.exe
          if-no-files-found: error

  windows:
    if: ${{ !inputs.runtime-only }}
    needs: pluto-bridge
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Download the gated bridge
        uses: actions/download-artifact@v4
        with:
          name: hyperion-pluto-bridge
          path: engine/tools/pluto-bridge

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95

      - name: Python bits
        run: python -m pip install fonttools

      - name: Libraries
        working-directory: engine
        run: python tools/get_libraries.py

      - name: Build
        working-directory: engine
        run: python tools/build_engine_x64.py --no-install

      - name: Package Shield
        working-directory: engine
        run: python tools/package.py --edition shield --channel ${{ inputs.channel }} --out testrun/share/variants

      - name: Test the public package
        working-directory: engine
        run: |
          python tools/test_package_variants.py
          python tools/test_package_variants.py --package-root testrun/share/variants
          python tools/run_tests.py

      - name: Package the Mac build inputs
        working-directory: engine
        run: python tools/mac_sync.py --out mac-inputs.tar.gz --extras --third

      - name: Upload the Windows package
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-shield-zero-windows
          path: engine/testrun/share/variants/**/Hyperion-Shield-Zero-*.zip
          if-no-files-found: error

      - name: Upload the Mac build inputs
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-mac-inputs
          path: engine/mac-inputs.tar.gz
          if-no-files-found: error

  linux:
    if: ${{ !inputs.runtime-only }}
    needs: pluto-bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Download the gated bridge
        uses: actions/download-artifact@v4
        with:
          name: hyperion-pluto-bridge
          path: engine/tools/pluto-bridge

      - name: Build the Linux toolchain image
        run: docker build -t hyperion-linux engine/tools/linux

      - name: Build and package Shield
        run: |
          docker run --rm -v "$PWD:/src" -w /src/engine hyperion-linux bash -lc '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends wine curl ca-certificates python3-pip
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95
            . "$HOME/.cargo/env"
            python3 -m pip install fonttools
            python3 tools/get_libraries.py
            python3 -c "import sys; sys.path.insert(0, \"tools\"); import build_sdl3; build_sdl3.fetch_source(); build_sdl3.apply_patches()"
            python3 tools/build_shaders_linux.py
            python3 tools/build_engine_linux.py
            python3 tools/package.py --linux x64 --edition shield --channel "${{ inputs.channel }}" --out testrun/share/variants
            python3 tools/test_package_variants.py
            python3 tools/test_package_variants.py --package-root testrun/share/variants
            python3 tools/run_tests.py
          '

      - name: Upload the Linux package
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-shield-zero-linux
          path: engine/testrun/share/variants/**/Hyperion-Shield-Zero-*.tar.gz
          if-no-files-found: error

  mac:
    if: ${{ !inputs.runtime-only }}
    needs: [windows, pluto-bridge]
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Tools
        run: |
          brew install ninja cmake || brew upgrade cmake ninja || true
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Unpack the Windows build inputs
        uses: actions/download-artifact@v4
        with:
          name: hyperion-mac-inputs
          path: ${{ runner.temp }}/mac-inputs

      - name: Extract the Windows build inputs
        run: tar xzf "$RUNNER_TEMP/mac-inputs/mac-inputs.tar.gz"

      - name: Download the authoritative gated bridge
        uses: actions/download-artifact@v4
        with:
          name: hyperion-pluto-bridge
          path: engine/tools/pluto-bridge

      - name: Build and package Shield
        working-directory: engine
        run: |
          set -euo pipefail
          python3 tools/build_engine_linux.py
          python3 tools/package.py --mac --edition shield --channel "${{ inputs.channel }}" --out testrun/share/variants
          python3 tools/test_package_variants.py
          python3 tools/test_package_variants.py --package-root testrun/share/variants
          python3 tools/run_tests.py

      - name: Upload the Mac package
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-shield-zero-mac
          path: engine/testrun/share/variants/**/Hyperion-Shield-Zero-*-mac-arm64.zip
          if-no-files-found: error

  pluto-macos-runtime:
    needs: pluto-bridge
    runs-on: ${{ inputs.mac-backend == 'fex-probe' && 'macos-26' || 'macos-15' }}
    timeout-minutes: 60
    env:
      WINE_VERSION: "11.21"
      WINE_ARCHIVE: "wine-devel-11.21-osx64.tar.xz"
      WINE_SHA256: "9909b486657e10ab66c7279371ae1f990345b596b3b1b3a0cf21f28af24fa0ce"
      FEX_WINE_ARCHIVE: "MetalSharp-Wine-6.0-arm64.zip"
      FEX_WINE_SHA256: "25f7dff91000c03c835b800980878acb12c1f952a4b7853f77de7f21fb87046f"
      PLUTO_ARCHIVE_SHA256: "17544fc3ab32e3e2823646887e021cf998362348d73740817e94d1a78aa6209d"
      ROSETTA_ADVERTISE_AVX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Download the gated Hyperion bridge
        uses: actions/download-artifact@v4
        with:
          name: hyperion-pluto-bridge
          path: engine/tools/pluto-bridge

      - name: Download the Hyperion-owned CPU feature probe
        uses: actions/download-artifact@v4
        with:
          name: hyperion-pluto-cpuid-probe
          path: engine/tools/pluto-bridge

      - name: Require macOS 15+ Apple Silicon and a working Rosetta translator
        run: |
          set -euo pipefail
          sw_vers
          test "$(uname -m)" = arm64
          test "$(/usr/sbin/sysctl -n kern.osproductversion | cut -d. -f1)" -ge 15
          if ! /usr/bin/arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true

      - name: Require the FEX runtime's signed i386-capable macOS floor
        if: ${{ inputs.mac-backend == 'fex-probe' }}
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          version = subprocess.check_output(['/usr/sbin/sysctl', '-n', 'kern.osproductversion'], text=True).strip()
          parts = tuple(int(part) for part in re.findall(r'\d+', version)[:2])
          if parts < (26, 4):
              raise SystemExit(f'MetalSharp Wine i386 needs macOS 26.4+, found {version}')
          print(f'FEX probe OS: {version}')
          PY

      - name: Install the pinned official WineHQ macOS build without Homebrew
        if: ${{ inputs.mac-backend == 'rosetta' }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$WINE_ARCHIVE"
          curl --proto '=https' --tlsv1.2 --retry 3 -fL \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/${WINE_VERSION}/$WINE_ARCHIVE" \
            -o "$archive"
          printf '%s  %s\n' "$WINE_SHA256" "$archive" | shasum -a 256 -c -
          root="$RUNNER_TEMP/wine-$WINE_VERSION"
          mkdir -p "$root"
          tar -xJf "$archive" -C "$root"
          wine_root="$root/Wine Devel.app/Contents/Resources/wine"
          wine="$wine_root/bin/wine"
          test -f "$wine"
          test -x "$wine"
          file "$wine"
          version="$(WINEPREFIX="$RUNNER_TEMP/wine-version-prefix" "$wine" --version)"
          printf '%s\n' "$version"
          case "$version" in wine-11.*) ;; *) echo "Wine 11 is required" >&2; exit 1 ;; esac
          test -f "$wine_root/lib/wine/i386-windows/ntdll.dll"
          test -f "$wine_root/lib/wine/x86_64-windows/ntdll.dll"
          test -x "$wine_root/lib/wine/x86_64-unix/wine"
          echo "HYPERION_PLUTO_WINE=$wine" >> "$GITHUB_ENV"

      - name: Install the pinned signed MetalSharp Wine/FEX diagnostic runtime
        if: ${{ inputs.mac-backend == 'fex-probe' }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$FEX_WINE_ARCHIVE"
          curl --proto '=https' --tlsv1.2 --retry 3 -fL \
            "https://github.com/metalsharp/MetalSharp-Wine/releases/download/v6.0/$FEX_WINE_ARCHIVE" \
            -o "$archive"
          printf '%s  %s\n' "$FEX_WINE_SHA256" "$archive" | shasum -a 256 -c -
          root="$RUNNER_TEMP/metalsharp-wine-6.0"
          mkdir -p "$root"
          ditto -x -k "$archive" "$root"
          app="$root/MetalSharp-Wine.app"
          codesign --verify --strict --deep "$app"
          wine="$app/Contents/MacOS/wine"
          test -x "$wine"
          test -x "$app/Contents/MacOS/wineserver"
          test -f "$app/Contents/embedded.provisionprofile"
          file "$wine"
          "$wine" --version
          echo "HYPERION_PLUTO_WINE=$wine" >> "$GITHUB_ENV"

      - name: Compare native Rosetta and Wine x86 feature detection
        if: ${{ inputs.mac-backend == 'rosetta' }}
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/cpuid-probe-macos"
          clang++ -std=c++17 -O0 -arch x86_64 engine/tools/pluto-bridge/cpuid_probe.cpp -o "$native"
          echo '--- native x86-64 under Rosetta ---'
          /usr/bin/arch -x86_64 "$native"
          echo '--- Windows x86-64 under Wine/Rosetta ---'
          WINEPREFIX="$RUNNER_TEMP/wine-cpuid-prefix" WINEDEBUG=-all \
            "$HYPERION_PLUTO_WINE" "$PWD/engine/tools/pluto-bridge/cpuid-probe.exe"

      - name: Probe x86 feature detection through signed Wine/FEX
        if: ${{ inputs.mac-backend == 'fex-probe' }}
        run: |
          set -euo pipefail
          WINEPREFIX="$RUNNER_TEMP/wine-fex-cpuid-prefix" WINEDEBUG=-all \
            "$HYPERION_PLUTO_WINE" "$PWD/engine/tools/pluto-bridge/cpuid-probe.exe"

      - name: Check production capability resolution and the harness's host-only tests
        if: ${{ inputs.mac-backend == 'rosetta' }}
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/pluto_runtime_regression"
          python3 engine/tools/fetch_stormlib.py
          clang++ -std=c++20 -O0 -w -Wno-c++11-narrowing -Wno-incompatible-ms-struct \
            -fno-strict-aliasing -fwrapv -fno-delete-null-pointer-checks -ffp-contract=off \
            -fsigned-char -mms-bitfields -fno-sized-deallocation -ffunction-sections \
            -fdata-sections -DNDEBUG -DHIGHFIRST -DSB_NETCODE_OFF -DOC_WITH_HELD \
            -include engine/src117/h/compiler.h -Iengine/src117/compat -Iengine/src117/h \
            engine/tools/pluto-native-tests/pluto_runtime_regression.cpp -lz -o "$probe"
          HYPERION_PLUTO_WINE="$HYPERION_PLUTO_WINE" "$probe" current-capability
          "$probe" wine-resolution
          "$probe" wine-11-preflight
          "$probe" mac-wine-capability
          python3 engine/tools/pluto-bridge/test_macos_runtime_acceptance.py

      - name: Run the real 32-bit DLL bridge and 64-bit inference on synthetic frames
        if: ${{ inputs.mac-backend == 'rosetta' }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pluto-v2.0.zip"
          curl --proto '=https' --tlsv1.2 --retry 3 -fL \
            "https://github.com/tscmoo/pluto/releases/download/v2.0/pluto-v2.0.zip" \
            -o "$archive"
          printf '%s  %s\n' "$PLUTO_ARCHIVE_SHA256" "$archive" | shasum -a 256 -c -
          python3 engine/tools/pluto-bridge/macos_runtime_acceptance.py \
            --wine "$HYPERION_PLUTO_WINE" \
            --bridge engine/tools/pluto-bridge/pluto-bridge.exe \
            --pluto-zip "$archive" \
            --work "$RUNNER_TEMP/pluto-macos-runtime-acceptance"

  publish:
    if: ${{ inputs.publish && !inputs.runtime-only && inputs.mac-backend == 'rosetta' }}
    needs: [pluto-bridge, windows, linux, mac, pluto-macos-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Verify the exact artifacts before publishing
        run: python3 engine/tools/test_package_variants.py --package-root packages

      - name: Create an immutable public Shield release
        run: |
          set -euo pipefail
          prerelease=()
          if [ "$CHANNEL" = prerelease ]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; choose a new version instead of replacing its assets." >&2
            exit 1
          fi
          gh release create "$TAG" --target "${{ inputs.ref }}" --title "Hyperion Shield Zero $TAG" \
            --notes "Hyperion Shield Zero, without StarCraft game files. Supply your own StarCraft: Remastered or classic Brood War install." \
            "${prerelease[@]}"
          find packages -type f \( -name 'Hyperion-Shield-Zero-*.zip' -o -name 'Hyperion-Shield-Zero-*.tar.gz' \) \
            -print0 | sort -z | while IFS= read -r -d '' file; do
              (cd "${file%/*}" && sha256sum "${file##*/}")
            done > packages/hyperion-shield-zero-checksums.txt
          find packages -type f \( -name 'Hyperion-Shield-Zero-*.zip' -o -name 'Hyperion-Shield-Zero-*.tar.gz' \) \
            -exec gh release upload "$TAG" {} \;
          gh release upload "$TAG" packages/hyperion-shield-zero-checksums.txt
