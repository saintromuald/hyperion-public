# Manual public Hyperion Shield packages. Hyperion Zero has no upload workflow:
# its private full bundle is built locally with the maintainer's own game install.
name: Hyperion Shield release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch, tag or commit to package"
        required: true
        default: "release-v0.7.1"
      tag:
        description: "release tag to create or update"
        required: true
        default: "hyperion-shield-v0.7.1-beta"
      channel:
        description: "publish as a prerelease for testing or a final release"
        required: true
        default: "prerelease"
        type: choice
        options:
          - prerelease
          - release

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95

      - name: Python bits
        run: python -m pip install fonttools

      - name: Libraries
        working-directory: engine
        run: python tools/get_libraries.py

      - name: Build
        working-directory: engine
        run: python tools/build_engine_x64.py --no-install

      - name: Package Shield
        working-directory: engine
        run: python tools/package.py --edition shield --channel ${{ inputs.channel }} --out testrun/share/variants

      - name: Package the Mac build inputs
        working-directory: engine
        run: python tools/mac_sync.py --out mac-inputs.tar.gz --extras --third

      - name: Upload the Windows package
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-shield-windows
          path: engine/testrun/share/variants/**/Hyperion-Shield-*.zip
          if-no-files-found: error

      - name: Upload the Mac build inputs
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-mac-inputs
          path: engine/mac-inputs.tar.gz
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build the Linux toolchain image
        run: docker build -t hyperion-linux engine/tools/linux

      - name: Build and package Shield
        run: |
          docker run --rm -v "$PWD:/src" -w /src/engine hyperion-linux bash -lc '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends wine cargo python3-pip
            python3 -m pip install --break-system-packages fonttools
            python tools/get_libraries.py
            python -c "import sys; sys.path.insert(0, \"tools\"); import build_sdl3; build_sdl3.fetch_source(); build_sdl3.apply_patches()"
            python tools/build_shaders_linux.py
            python tools/build_engine_linux.py
            python tools/package.py --linux x64 --edition shield --channel "${{ inputs.channel }}" --out testrun/share/variants
          '

      - name: Upload the Linux package
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-shield-linux
          path: engine/testrun/share/variants/**/Hyperion-Shield-*.tar.gz
          if-no-files-found: error

  mac:
    needs: windows
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Tools
        run: brew install ninja cmake || brew upgrade cmake ninja || true

      - name: Unpack the Windows build inputs
        uses: actions/download-artifact@v4
        with:
          name: hyperion-mac-inputs
          path: ${{ runner.temp }}/mac-inputs

      - name: Extract the Windows build inputs
        working-directory: ${{ runner.temp }}/mac-inputs
        run: tar xzf engine/mac-inputs.tar.gz

      - name: Build and package Shield
        working-directory: ${{ runner.temp }}/mac-inputs/engine
        run: |
          set -euo pipefail
          python3 tools/build_engine_linux.py
          python3 tools/package.py --mac --edition shield --channel "${{ inputs.channel }}" --out testrun/share/variants

      - name: Upload the Mac package
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-shield-mac
          path: ${{ runner.temp }}/mac-inputs/engine/testrun/share/variants/**/Hyperion-Shield-*-mac-arm64.zip
          if-no-files-found: error

  publish:
    needs: [windows, linux, mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Create or update the public Shield release
        run: |
          set -euo pipefail
          prerelease=()
          if [ "$CHANNEL" = prerelease ]; then prerelease=(--prerelease); fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Hyperion Shield $TAG" \
              --notes "Hyperion Shield, without StarCraft game files. Supply your own StarCraft: Remastered or classic Brood War install." \
              "${prerelease[@]}"
          else
            if [ "$CHANNEL" = prerelease ]; then
              gh release edit "$TAG" --prerelease
            else
              gh release edit "$TAG" --prerelease=false
            fi
          fi
          find packages -type f \( -name 'Hyperion-Shield-*.zip' -o -name 'Hyperion-Shield-*.tar.gz' \) \
            -exec gh release upload "$TAG" {} --clobber \;
