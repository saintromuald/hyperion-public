# Builds the fork's Windows program (with Remastered HD) on a GitHub runner and uploads
# a complete Shield package after the mandatory bridge/package gate.
name: Windows package

on:
  push:
    branches: [remastered-win]
  workflow_dispatch:
    inputs:
      ref:
        description: "branch, tag or commit to build"
        required: true
        default: "remastered-win"

permissions:
  contents: read

jobs:
  pluto-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LLVM_MINGW_VERSION: "20261020"
      LLVM_MINGW_SHA256: "ceb8c5acc6f76e143f9c714772d2fa677027802561ce68c396e8dc990a80f0b6"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Install the pinned llvm-mingw toolchain
        run: |
          set -euo pipefail
          name="llvm-mingw-${LLVM_MINGW_VERSION}-msvcrt-ubuntu-22.04-x86_64"
          archive="$RUNNER_TEMP/$name.tar.xz"
          curl --proto '=https' --tlsv1.2 --retry 3 -fL \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/$name.tar.xz" \
            -o "$archive"
          printf '%s  %s\n' "$LLVM_MINGW_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "MINGW=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Clean bridge build and tests
        working-directory: engine/tools/pluto-bridge
        run: |
          set -euo pipefail
          test ! -e pluto-bridge.exe
          ./build.sh
          ./host/run-tests.sh
          ./lifecycle/run-tests.sh
          ./metadata/run-tests.sh
          ./late-state/run_tests.sh

      - name: Upload only the Hyperion-owned bridge
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-pluto-bridge
          path: engine/tools/pluto-bridge/pluto-bridge.exe
          if-no-files-found: error

  windows:
    needs: pluto-bridge
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Download the gated bridge
        uses: actions/download-artifact@v4
        with:
          name: hyperion-pluto-bridge
          path: engine/tools/pluto-bridge

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95

      - name: Python bits
        run: python -m pip install fonttools

      - name: Libraries
        working-directory: engine
        run: python tools/get_libraries.py

      - name: Build
        working-directory: engine
        run: python tools/build_engine_x64.py --no-install

      - name: Package and test Shield
        working-directory: engine
        run: |
          python tools/package.py --edition shield --channel prerelease --out testrun/share/variants
          python tools/test_package_variants.py
          python tools/test_package_variants.py --package-root testrun/share/variants

      - name: Upload the gated package
        uses: actions/upload-artifact@v4
        with:
          name: Hyperion-windows
          path: engine/testrun/share/variants/**/Hyperion-Shield-Zero-*-windows-x64.zip
          if-no-files-found: error
